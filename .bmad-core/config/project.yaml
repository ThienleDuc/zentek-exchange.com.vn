name: TMDT Website
version: "1.0"
created: "2026-05-23"
methodology: BMAD (Breakthrough Method for Agile AI-Driven Development)

project:
  name: "TMDT-Website"
  type: "E-commerce Platform"
  language: "vi"  # Vietnamese primary

agents:
  catalog:
    - id: bmad-master
      file: .bmad-core/agents/bmad-master.md
    - id: bmad-help
      file: .bmad-core/agents/bmad-help.md
    - id: analyst
      file: .bmad-core/agents/analyst.md
    - id: pm
      file: .bmad-core/agents/pm.md
    - id: architect
      file: .bmad-core/agents/architect.md
    - id: dev
      file: .bmad-core/agents/dev.md
    - id: qa
      file: .bmad-core/agents/qa.md
    - id: po
      file: .bmad-core/agents/po.md
    - id: sm
      file: .bmad-core/agents/sm.md

workflows:
  directory: .bmad-core/workflows/
  phases:
    - id: phase-1
      name: "Analysis & Discovery"
      file: .bmad-core/workflows/phase-1-analysis.md
    - id: phase-2
      name: "Product Planning"
      file: .bmad-core/workflows/phase-2-planning.md
    - id: phase-3
      name: "Technical Design"
      file: .bmad-core/workflows/phase-3-design.md
    - id: phase-4
      name: "Implementation"
      file: .bmad-core/workflows/phase-4-implementation.md

output:
  directory: bmad-output/
  structure:
    phase-1: bmad-output/phase-1/
    phase-2: bmad-output/phase-2/
    phase-3: bmad-output/phase-3/
    phase-4: bmad-output/phase-4/

docs:
  directory: docs/
  subdirectories:
    - prd/
    - architecture/
    - api/
    - dev-notes/
    - user-guides/

templates:
  directory: .bmad-core/templates/

memory:
  directory: .bmad-core/memory/
  files:
    - project-standards.md
    - tech-decisions.md
    - lessons-learned.md
